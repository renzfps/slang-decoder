<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 16px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1b2e; color: #fff; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: #b8b3cc; font-size: 12px; }
    label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #4a4560; border-radius: 22px; transition: .15s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
    input:checked + .slider { background: #7c5cff; }
    input:checked + .slider::before { transform: translateX(18px); }
    .demo { margin-top: 14px; font-size: 12px; color: #b8b3cc; }
    .demo u { text-decoration: underline dotted #7c5cff; text-decoration-thickness: 2px; text-underline-offset: 3px; color: #fff; }
  </style>
</head>
<body>
  <h1>Slang Decoder</h1>
  <p>Hover any underlined abbreviation to see what it means.</p>
  <label>
    <span>Highlight slang</span>
    <span class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></span>
  </label>
  <div class="demo">Example: <u>lol</u> → Laugh out loud</div>
  <script src="popup.js"></script>
</body>
</html>
